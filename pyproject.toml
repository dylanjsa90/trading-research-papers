[project]
name = "trading-research-papers"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44.0",
    "anthropic>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "bs4>=0.0.2",
    "duckdb>=1.5.6",
    "pandas>=3.0.6",
    "playwright>=1.64.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pymupdf>=1.28.2",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.2",
    "pytest>=9.1.1",
]

[tool.ruff]
line-length = 115

[tool.pytest.ini_options]
testpaths = ["tests"]
